[project]
name = "agentic-delivery"
version = "0.2.0"
description = "Agentic delivery hub: project context, integrations and outputs, driven by Claude Code."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
ad = "delivery.cli:app"

# Adapters register here; instances and plugins can add their own packages.
[project.entry-points."delivery.adapters"]
local_fs = "delivery.adapters.local_fs:LocalFsStorage"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "delivery"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["workspace"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "S", "TID"]
ignore = ["S603", "S607"]  # subprocess calls to git are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=delivery --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
skip_empty = true

[tool.poe.tasks]
fmt = { shell = "ruff format . && ruff check --fix ." }
lint = { shell = "ruff format --check . && ruff check ." }
typecheck = "mypy"
test = "pytest"
check = ["lint", "typecheck", "test"]
smoke = { shell = "bash scripts/template-smoke.sh", help = "Render the copier template and run checks inside it" }

[dependency-groups]
dev = [
    "copier>=9.19.1",
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
