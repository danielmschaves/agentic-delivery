# Template-only: render the copier template for several stacks and run checks inside each.
name: template
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: uv run poe smoke
