name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe check
      - run: uv run ad doctor
      - run: uv run ad validate
      # Hooks include gitleaks, markdownlint and the template/root agent-file sync check.
      - run: SKIP=mypy,ruff,ruff-format uv run pre-commit run --all-files
